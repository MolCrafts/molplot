[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molcrafts-molplot"
version = "0.1.4"
description = "Unified scientific charting: scienceplots + a matplotlib-portable Vega-Lite preset"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "MolCrafts Team" }]
keywords = ["matplotlib", "scienceplots", "vega-lite", "charting", "visualization", "science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.6",
    "scienceplots>=2.1",
    "numpy",
]

[project.optional-dependencies]
convert = ["vl-convert-python>=1.6"]
dev = [
    "build>=1.0",
    "hatchling",
    "pytest>=7.0",
    "pytest-cov",
]

# Docs: Markdown fences live in the MolCrafts theme, not this package.
# Paper charting remains this package (`import molplot`).
[dependency-groups]
doc = [
    "zensical>=0.0.53",
    "molcrafts-zensical-theme>=0.2.5",
    "molcrafts-molplot",
]

[project.urls]
Homepage = "https://github.com/MolCrafts/molplot"
Repository = "https://github.com/MolCrafts/molplot"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Style sheets generated from presets/*.json — ship them with the package.
[tool.setuptools.package-data]
molplot = ["presets/*.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
