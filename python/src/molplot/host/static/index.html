<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MolPlot workbench</title>
    <style>
      html,
      body {
        margin: 0;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
        color: #161b22;
        background: #f1f4f7;
      }
      main {
        max-width: 36rem;
        margin: 4rem auto;
        padding: 0 1.5rem;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <main>
      <p>The figure workbench UI is not built.</p>
      <p>
        From the repo root run <code>npm run build:page</code>, then restart
        <code>molplot serve</code>. For live reload use
        <code>npm run dev</code> (proxies <code>/api</code> to this host).
      </p>
    </main>
  </body>
</html>
